{{- $full := include "urumi.fullname" . }}
{{- $servers := list
  (dict "name" "woo-mcp" "image" .Values.mcp.woo.image "mode" "rest" "tokenKey" "woo-mcp-token" "extra" "woo")
  (dict "name" "fx-mcp" "image" .Values.mcp.fx.image "mode" "" "tokenKey" "fx-mcp-token" "extra" "")
  (dict "name" "ops-mcp" "image" .Values.mcp.ops.image "mode" "" "tokenKey" "ops-mcp-token" "extra" "")
}}
{{- range $servers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-{{ .name }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: urumi-gate
    app.kubernetes.io/name: {{ .name }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-{{ .name }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: urumi-gate
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: urumi-gate
        app.kubernetes.io/name: {{ .name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: {{ .image }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOME
              value: /tmp
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.credentials.existingSecret }}
                  key: {{ .tokenKey }}
            {{- if eq .extra "woo" }}
            - name: WOO_MODE
              value: rest
            - name: WOO_BASE_URL
              value: http://{{ $full }}-wordpress/wp-json/wc/v3/
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.credentials.existingSecret }}
                  key: woo-consumer-key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.credentials.existingSecret }}
                  key: woo-consumer-secret
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.mcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
