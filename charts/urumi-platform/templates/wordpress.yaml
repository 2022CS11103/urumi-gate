apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.fullname" . }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "urumi.labels" . | nindent 8 }}
        app.kubernetes.io/name: wordpress
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ include "urumi.fullname" . }}-mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.database }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.user }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secret" . }}
                  key: mariadb-password
            - name: WORDPRESS_URL
              value: {{ .Values.wordpress.url | quote }}
            - name: WORDPRESS_TITLE
              value: {{ .Values.wordpress.title | quote }}
            - name: WORDPRESS_ADMIN_USER
              value: {{ .Values.wordpress.adminUser | quote }}
            - name: WORDPRESS_ADMIN_EMAIL
              value: {{ .Values.wordpress.adminEmail | quote }}
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secret" . }}
                  key: wordpress-admin-password
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secret" . }}
                  key: woo-consumer-key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secret" . }}
                  key: woo-consumer-secret
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 36
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["test", "-f", "/var/www/html/urumi-ready"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: {{ include "urumi.fullname" . }}-wordpress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "urumi.fullname" . }}-wordpress
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
